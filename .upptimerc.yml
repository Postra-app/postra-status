# Upptime config — Postra status page (observability.md Tier 0.6)
#
# Upptime dziala W CALOSCI na GitHub: Actions (cron "*/5", ale GitHub odpala go
# co kilka godzin: 4 przebiegi "Uptime CI" z crona w 24 h, 2026-10-05; free)
# + Issues (auto-incydenty) + Pages (strona statusu). NIE wymaga zadnej infry AWS.
#
# Setup (patrz README.md obok):
#   1. Stworz PUBLICZNE repo Postra-app/postra-status z szablonu github.com/upptime/upptime
#   2. Wrzuc ten plik do roota tego repo
#   3. Token: GitHub App (variable GH_APP_ID + secret GH_APP_PRIVATE_KEY);
#      secret GH_PAT usuniety 2026-10-06 (e2e/bugs.md E2E-11-05)
#   Workflowy sa przypiete recznie, aktualizacje szablonu Upptime wylaczone
#   (2026-10-07): nowe wersje akcji proponuje Dependabot (.github/dependabot.yml)
#   4. Wlacz Pages + ustaw DNS status.postra.pl -> postra-app.github.io
#      (terraform/envs/dev/main.tf, aws_route53_record.status)

owner: Postra-app
repo: postra-status

sites:
  - name: Postra App (API health)
    url: https://app.postra.pl/api/monitor/queue/main
    # backend liveness — zwraca 200. UWAGA: potwierdz ze endpoint jest publiczny
    # (bez auth) — jesli zwraca 401/403, uzyj https://app.postra.pl/ jako fallback.
  - name: Postra Landing
    url: https://postra.pl
  - name: Postra CDN
    # CloudFront cdn-dev.postra.pl; root has no default object, so the edge
    # answers 403 when healthy — both codes mean "CDN up".
    url: https://cdn-dev.postra.pl
    expectedStatusCodes:
      - 200
      - 403
  - name: Postra UK Landing
    url: https://postra.co.uk

status-website:
  cname: status.postra.pl
  name: Postra Status
  introTitle: "Postra — service status"
  introMessage: "Current availability of app.postra.pl and related services."
  # Single-item navbar: the GitHub tab rendered blank where this page is
  # mostly seen (embedded in the admin Dashboards iframe) because github.com
  # refuses framing via X-Frame-Options.
  navbar:
    - title: Status
      href: /

assignees:
  - KrisRz

# Probe: cron Upptime "*/5 * * * *", w praktyce co kilka godzin (GitHub opoznia
# i pomija scheduled runs). Powiadomienia: domyslnie GitHub Issues.
# Opcjonalnie Telegram/Slack/email — sekcja `notifications:` (patrz Upptime docs).

# Workflows are pinned by hand (template updates are off); this keeps the
# runner image and every action current.
runner: ubuntu-26.04
