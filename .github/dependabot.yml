# Every action here is pinned (third-party ones to a commit), and the Upptime
# template no longer rewrites the workflows, so this is what keeps them
# current: one pull request a week with whatever moved.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
  # The graph generator Graphs CI installs (tools/graph-generator, see graphs.yml).
  # Both folders are outside .github/: Dependabot cannot open a pull request
  # that changes a file there other than a workflow.
  - package-ecosystem: "npm"
    directory: "/tools/graph-generator"
    schedule:
      interval: "weekly"
    groups:
      graphs:
        patterns: ["*"]
  # The TruffleHog image secret-scan.yml runs (tools/scanners).
  - package-ecosystem: "docker"
    directory: "/tools/scanners"
    schedule:
      interval: "weekly"
