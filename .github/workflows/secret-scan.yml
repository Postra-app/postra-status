name: Secret scan

# The repository is private since 2026-11-02, and GitHub's secret scanning is
# not available on private repositories without a paid plan. TruffleHog checks
# the commits a push or pull request adds and fails on a credential it can
# confirm is live (it asks the provider). The status bot's commits carry
# [skip ci], so this runs only for people's pushes and pull requests.
# The version is in .github/tools, where Dependabot watches it.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # From where the branch left master (a new branch has no "before"), or
      # from the previous tip on master.
      - name: TruffleHog (verified secrets in the new commits)
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          SINCE="${BASE:-$BEFORE}"
          if [ -z "$SINCE" ] || [ "$SINCE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$SINCE^{commit}" 2>/dev/null; then
            SINCE=$(git merge-base HEAD origin/master)
          fi
          if [ "$SINCE" = "$(git rev-parse HEAD)" ]; then
            echo "No new commits."
            exit 0
          fi
          echo "Scanning $(git rev-list --count "$SINCE"..HEAD) commits since $SINCE"
          TRUFFLEHOG=$(sed -n 's/^FROM //p' .github/tools/trufflehog.Dockerfile)
          docker run --rm --user "$(id -u):$(id -g)" -v "${PWD}:/repo" "$TRUFFLEHOG" \
            git file:///repo --since-commit "$SINCE" --branch HEAD \
            --results=verified --fail --no-update
